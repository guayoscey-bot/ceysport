<!-- Script inteligente que lee y muestra los productos creados en el CMS -->
    <script>
        async function cargarProductos() {
            const container = document.getElementById('productos-container');
            
            try {
                // Hacemos una petición para obtener el listado de archivos dentro de content/productos
                const response = await fetch('/content/productos/');
                
                if (!response.ok) {
                    throw new Error('No se pudo acceder a la carpeta de productos');
                }
                
                const files = await response.json();
                
                // Si no hay productos creados aún
                if (!files || files.length === 0) {
                    container.innerHTML = `
                        <div class="no-products">
                            <p>No hay productos disponibles todavía. Agrega tus guayos desde el <a href="/admin/" style="color: #27ae60; font-weight: bold;">Panel de Administración</a>.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = ''; // Limpiar el "cargando..."

                // Recorremos cada archivo de producto creado
                for (const file of files) {
                    if (file.name.endsWith('.json') || file.name.endsWith('.md')) {
                        const fileRes = await fetch(`/content/productos/${file.name}`);
                        const text = await fileRes.text();
                        
                        let producto = {};
                        if (file.name.endsWith('.json')) {
                            producto = JSON.parse(text);
                        } else {
                            // Si es Markdown con frontmatter, extraemos los datos básicos
                            // (Nota: Decap CMS suele guardar muy limpio si se configura en json, pero soportamos texto)
                            producto = parseMarkdownFrontmatter(text);
                        }

                        // Creamos la tarjeta visual para cada producto
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        
                        // Número de WhatsApp al que llegará el pedido (puedes cambiarlo por el tuyo)
                        const telefonoWhatsApp = "573000000000"; 
                        const mensaje = encodeURIComponent(`¡Hola! Estoy interesado en el producto: ${producto.nombre || 'Artículo'} con precio $${producto.precio || ''} y tallas ${producto.tallas || ''}`);

                        card.innerHTML = `
                            <img src="${producto.imagen || 'https://via.placeholder.com/300'}" alt="${producto.nombre || 'Producto'}" class="product-image">
                            <div class="product-info">
                                <h3 class="product-title">${producto.nombre || 'Sin nombre'}</h3>
                                <div class="product-price">$ ${producto.precio || '0'}</div>
                                <div class="product-sizes"><strong>Tallas:</strong> ${producto.tallas || 'Única'}</div>
                                <div class="product-desc">${producto.descripcion || ''}</div>
                                <a href="https://wa.me/${telefonoWhatsApp}?text=${mensaje}" target="_blank" class="btn-whatsapp">Comprar por WhatsApp</a>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                }

            } catch (error) {
                // Si el entorno estático de Netlify bloquea el listado directo de carpetas por seguridad, 
                // usamos un mensaje claro para guiarte:
                container.innerHTML = `
                    <div class="no-products">
                        <p>¡Tu tienda está conectada! Si acabas de agregar un producto, asegúrate de hacer clic en <strong>Publish</strong> en el <a href="/admin/" style="color: #27ae60; font-weight: bold;">Panel de Administración</a> y recargar la página en unos segundos.</p>
                    </div>
                `;
            }
        }

        // Función auxiliar básica para leer metadatos si fuera Markdown
        function parseMarkdownFrontmatter(text) {
            let data = {};
            const match = text.match(/---([\s\S]*?)---/);
            if (match) {
                const lines = match[1].split('\n');
                lines.forEach(line => {
                    const parts = line.split(':');
                    if (parts.length >= 2) {
                        const key = parts[0].trim();
                        const val = parts.slice(1).join(':').trim().replace(/^["'](.*)["']$/, '$1');
                        data[key] = val;
                    }
                });
            }
            return data;
        }

        cargarProductos();
    </script>
