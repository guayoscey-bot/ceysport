<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEY SPORT - Tienda de Guayos y Artículos Deportivos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <img src="https://i.ibb.co/HTT43j9y/fondo-cey.png" alt="Logo CEY SPORT" class="logo-superior" style="display:none;">
        <h1 class="title">CEY <span>SPORT</span></h1>
        <div style="margin-top: 15px;">
            <a href="/admin/" class="admin-link" style="color: var(--gold); text-decoration: none; border: 1px solid var(--gold); padding: 8px 15px; border-radius: 4px; font-weight: bold;">Panel Admin</a>
        </div>
    </header>

    <nav class="nav-bar">
        <button onclick="filtrar('guayos', this)" class="active">Guayos</button>
        <button onclick="filtrar('sintetica', this)">Sintética</button>
        <button onclick="filtrar('futsal', this)">Futsal</button>
        <button onclick="filtrar('guantes', this)">Guantes</button>
        <button onclick="filtrar('accesorios', this)">Accesorios</button>
    </nav>

    <div id="subfiltros" class="sub-nav"></div>

    <div id="filtro-precio" style="display: flex; justify-content: center; margin-bottom: 20px;">
        <select id="selectPrecio" onchange="filtrarPorPrecio(this.value)" style="background: #000; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px;">
            <option value="todos">Todos los precios</option>
            <option value="0-150000">Menos de $150.000</option>
            <option value="150000-250000">$150.000 - $250.000</option>
            <option value="250000-9999999">Más de $250.000</option>
        </select>
    </div>

    <main class="catalog-grid" id="lista">
        <p style="grid-column: 1/-1; text-align: center;">Cargando productos...</p>
    </main>

    <div class="social-float">
        <a href="https://wa.me/573242445670" target="_blank" class="btn-float wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <a href="https://instagram.com" target="_blank" class="btn-float ig"><i class="fab fa-instagram"></i> Instagram</a>
    </div>

    <!-- Modal de Pedido -->
    <div id="modalPedido" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="cerrarPedido()">&times;</button>
            <h3 style="color: var(--gold); font-family: 'Orbitron', sans-serif; text-align: center;">Completar Pedido</h3>
            <form id="formPedido" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="pNombre" placeholder="Tu Nombre Completo" required style="padding: 10px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px;">
                <input type="text" id="pDoc" placeholder="Cédula o TI" required style="padding: 10px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px;">
                <input type="text" id="pCiudad" placeholder="Ciudad / Municipio" required style="padding: 10px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px;">
                <input type="text" id="pDir" placeholder="Dirección de entrega" required style="padding: 10px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px;">
                <input type="tel" id="pTel" placeholder="Número de Teléfono" required style="padding: 10px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px;">
                <button type="submit" class="btn-action" style="margin-top: 10px;">ENVIAR PEDIDO A WHATSAPP</button>
            </form>
        </div>
    </div>

    <!-- Modal Guía de Tallas -->
    <div id="modalTallas" class="modal-overlay" onclick="cerrarGuiaTallas()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="cerrarGuiaTallas()">&times;</button>
            <h3 style="color: var(--gold); text-align: center;">Guía de Tallas</h3>
            <img src="https://i.ibb.co/GuiaTallasEjemplo.png" alt="Guía de Tallas" class="modal-img" id="imgGuiaTallas" onerror="this.src='https://via.placeholder.com/400x300?text=Guia+de+Tallas'">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
